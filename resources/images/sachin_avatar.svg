<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <!-- Modern Executive Studio Background Gradient -->
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Ambient Studio Spotlight behind subject -->
    <radialGradient id="studioSpotlight" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="80%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Warm key light for subtle rim lighting -->
    <radialGradient id="warmRimLight" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </radialGradient>

    <!-- Skin tone gradients -->
    <linearGradient id="skinBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfb394" />
      <stop offset="60%" stop-color="#c99b7b" />
      <stop offset="100%" stop-color="#b68463" />
    </linearGradient>

    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a4704e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a4704e" stop-opacity="0.0" />
    </linearGradient>

    <!-- Suit Fabric Gradient -->
    <linearGradient id="suitFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>

    <linearGradient id="lapelShading" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3242" />
      <stop offset="100%" stop-color="#141824" />
    </linearGradient>

    <!-- Shirt Fabric Gradient -->
    <linearGradient id="shirtFabric" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Hair Wave Gradients -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3340" />
      <stop offset="40%" stop-color="#191c24" />
      <stop offset="100%" stop-color="#0e1017" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- =========================================================================
       1. CHANGED BACKGROUND (Executive Studio Backdrop with Ambient Lighting)
       ========================================================================= -->
  <!-- Base studio background canvas -->
  <rect width="600" height="750" fill="url(#studioBg)" />

  <!-- Studio Ambient Spotlight (gives depth behind the person) -->
  <rect width="600" height="750" fill="url(#studioSpotlight)" />
  <rect width="600" height="750" fill="url(#warmRimLight)" />

  <!-- Subtle Studio Technical Grid / Frame Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1">
    <circle cx="300" cy="310" r="230" fill="none" stroke-dasharray="4 8" />
    <circle cx="300" cy="310" r="245" fill="none" stroke-opacity="0.06" />
    <line x1="50" y1="310" x2="100" y2="310" />
    <line x1="500" y1="310" x2="550" y2="310" />
  </g>

  <!-- =========================================================================
       2. OUTSIDE SPACING & CENTERED PORTRAIT SUBJECT (Sachin Kumar)
          Generous breathing room: ~80px at top, ~60px at left/right edges
       ========================================================================= -->
  <g id="subject-group" transform="translate(300, 320)">
    
    <!-- Outer Soft Backlight Glow around Subject -->
    <path d="M-190,260 C-185,150 -160,110 -110,90 C-95,-10 -60,-130 0,-135 C60,-130 95,-10 110,90 C160,110 185,150 190,260 Z" 
          fill="#3b82f6" opacity="0.18" filter="url(#softGlow)" />

    <!-- -----------------------------------------------------------------------
         SUIT & SHIRT (Black blazer, light grey shirt from photo.jpg)
         ----------------------------------------------------------------------- -->
    <!-- Torso / Shoulders base -->
    <path d="M-210,380 L-205,250 C-180,185 -135,160 -65,145 L65,145 C135,160 180,185 205,250 L210,380 Z" 
          fill="url(#suitFabric)" />

    <!-- Dress Shirt (Light Silver Grey) -->
    <path d="M-65,145 L-25,270 L0,285 L25,270 L65,145 Z" fill="url(#shirtFabric)" />
    
    <!-- Shirt Collar (Left & Right Flaps) -->
    <!-- Left Collar -->
    <polygon points="-65,145 -18,185 -30,225 -58,155" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Right Collar -->
    <polygon points="65,145 18,185 30,225 58,155" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Shirt Inner Placket & Button -->
    <line x1="0" y1="200" x2="0" y2="280" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="0" cy="235" r="3" fill="#64748b" stroke="#ffffff" stroke-width="0.8" />

    <!-- Suit Lapels (Dark Tailored Lapels) -->
    <!-- Left Lapel -->
    <path d="M-65,145 L-95,210 L-75,225 L-22,295 L-110,380 L-205,250 C-180,185 -135,160 -65,145 Z" 
          fill="url(#lapelShading)" stroke="#090d14" stroke-width="1.5" />
    <!-- Right Lapel -->
    <path d="M65,145 L95,210 L75,225 L22,295 L110,380 L205,250 C180,185 135,160 65,145 Z" 
          fill="url(#suitFabric)" stroke="#090d14" stroke-width="1.5" />

    <!-- Neck & Throat -->
    <path d="M-36,105 C-36,145 -22,175 0,182 C22,175 36,105 36,105 Z" fill="#b68463" />
    <!-- Neck shadow under chin -->
    <path d="M-34,105 C-18,135 18,135 34,105 C20,122 -20,122 -34,105 Z" fill="#8e5d3c" opacity="0.6" />

    <!-- -----------------------------------------------------------------------
         HEAD, FACE & REAL FACIAL FEATURES (Exact Likeness from photo.jpg)
         ----------------------------------------------------------------------- -->
    <!-- Ears -->
    <!-- Left Ear -->
    <path d="M-64,15 C-76,15 -80,45 -68,65 C-63,72 -58,68 -58,60 Z" fill="#c99b7b" stroke="#a4704e" stroke-width="1" />
    <path d="M-68,32 C-72,40 -70,52 -65,56" stroke="#8e5d3c" stroke-width="1.5" fill="none" />
    <!-- Right Ear -->
    <path d="M64,15 C76,15 80,45 68,65 C63,72 58,68 58,60 Z" fill="#c99b7b" stroke="#a4704e" stroke-width="1" />
    <path d="M68,32 C72,40 70,52 65,56" stroke="#8e5d3c" stroke-width="1.5" fill="none" />

    <!-- Head & Jaw Contour (Square-oval, masculine jawline from photo) -->
    <path d="M-60,0 C-64,-70 64,-70 60,0 C59,48 54,82 32,104 C18,118 -18,118 -32,104 C-54,82 -59,48 -60,0 Z" 
          fill="url(#skinBase)" />

    <!-- Subtle Cheekbone & Jaw Shading -->
    <path d="M-58,25 C-56,65 -45,92 -28,105 C-36,92 -48,65 -50,25 Z" fill="#a4704e" opacity="0.35" />
    <path d="M58,25 C56,65 45,92 28,105 C36,92 48,65 50,25 Z" fill="#a4704e" opacity="0.35" />

    <!-- Stubble Beard & Mustache (Well-groomed from photo.jpg) -->
    <g opacity="0.32" fill="#1c202a">
      <!-- Chin & Jawline stubble shadow -->
      <path d="M-42,75 C-35,102 -15,114 0,115 C15,114 35,102 42,75 C36,96 18,108 0,109 C-18,108 -36,96 -42,75 Z" />
      <!-- Mustache shadow over upper lip -->
      <path d="M-22,60 C-10,55 0,57 0,57 C0,57 10,55 22,60 C12,65 0,64 0,64 C0,64 -12,65 -22,60 Z" />
      <!-- Soul patch under lower lip -->
      <path d="M-6,80 C-4,88 4,88 6,80 Z" />
    </g>

    <!-- Eyes & Eyebrows (Dark, expressive from photo.jpg) -->
    <!-- Eyebrows -->
    <path d="M-48,-4 C-35,-12 -20,-12 -12,-5 C-19,-9 -34,-9 -46,-2 Z" fill="#181a20" />
    <path d="M48,-4 C35,-12 20,-12 12,-5 C19,-9 34,-9 46,-2 Z" fill="#181a20" />

    <!-- Left Eye -->
    <ellipse cx="-28" cy="8" rx="12" ry="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <circle cx="-27" cy="8" r="5" fill="#241b18" />
    <circle cx="-28.5" cy="6.5" r="1.5" fill="#ffffff" />
    <!-- Upper eyelid -->
    <path d="M-40,7 C-32,0 -20,0 -16,7" stroke="#1c202a" stroke-width="1.8" fill="none" />
    <path d="M-38,15 C-30,19 -22,19 -18,15" stroke="#a4704e" stroke-width="0.8" fill="none" opacity="0.6" />

    <!-- Right Eye -->
    <ellipse cx="28" cy="8" rx="12" ry="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <circle cx="27" cy="8" r="5" fill="#241b18" />
    <circle cx="25.5" cy="6.5" r="1.5" fill="#ffffff" />
    <!-- Upper eyelid -->
    <path d="M16,7 C20,0 32,0 40,7" stroke="#1c202a" stroke-width="1.8" fill="none" />
    <path d="M18,15 C22,19 30,19 38,15" stroke="#a4704e" stroke-width="0.8" fill="none" opacity="0.6" />

    <!-- Nose (Straight bridge & defined tip from photo) -->
    <path d="M-3,5 L-5,38 C-12,42 -10,48 -5,48 C-1,48 0,47 0,47 C0,47 1,47 5,48 C10,48 12,42 5,38 L3,5" 
          fill="none" stroke="#a4704e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="-6" cy="46" rx="2.5" ry="1.5" fill="#8e5d3c" opacity="0.7" />
    <ellipse cx="6" cy="46" rx="2.5" ry="1.5" fill="#8e5d3c" opacity="0.7" />

    <!-- Mouth & Smile (Friendly closed gentle smile from photo) -->
    <path d="M-22,68 C-10,75 10,75 22,68" stroke="#7a3f37" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <!-- Upper lip definition -->
    <path d="M-18,67 C-9,63 0,65 0,65 C0,65 9,63 18,67" stroke="#9f6158" stroke-width="1.2" fill="none" />
    <!-- Lower lip fullness -->
    <path d="M-14,71 C-7,77 7,77 14,71" stroke="#b5756c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />

    <!-- -----------------------------------------------------------------------
         WAVY DARK HAIR (Styling & waves from photo.jpg)
         ----------------------------------------------------------------------- -->
    <!-- Base Hair Mass -->
    <path d="M-63,5 C-68,-25 -62,-65 -45,-90 C-25,-115 0,-122 30,-115 C55,-108 72,-80 68,-30 C68,-10 65,5 60,18 C58,0 52,-35 40,-52 C25,-70 -10,-72 -32,-60 C-46,-50 -55,-25 -56,5 Z" 
          fill="url(#hairGrad)" />

    <!-- Prominent Natural Waves and Curls on Top (from photo) -->
    <!-- Wave 1 (Left curl) -->
    <path d="M-48,-65 C-55,-92 -35,-118 -10,-122 C-22,-110 -35,-95 -32,-75 Z" fill="#2d3340" />
    <!-- Wave 2 (Center crest) -->
    <path d="M-25,-105 C-5,-130 25,-128 42,-110 C25,-115 5,-112 -12,-98 Z" fill="#384050" />
    <!-- Wave 3 (Right wave) -->
    <path d="M15,-115 C45,-120 68,-95 62,-60 C58,-78 40,-95 22,-98 Z" fill="#242935" />
    
    <!-- Forehead Hairline Definition & Individual Textured Locks -->
    <path d="M-55,-15 C-42,-45 -22,-52 5,-48 C25,-44 42,-55 52,-20 C42,-35 25,-32 8,-36 C-12,-40 -35,-32 -48,-10 Z" 
          fill="#191c24" />

    <!-- Sideburns -->
    <path d="M-60,0 L-58,35 L-54,32 L-55,0 Z" fill="#191c24" />
    <path d="M60,0 L58,35 L54,32 L55,0 Z" fill="#191c24" />
  </g>

  <!-- =========================================================================
       3. ENTERPRISE FLOATING TAG (Technical Identity Accent)
       ========================================================================= -->
  <g transform="translate(300, 680)">
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#090d16" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="-116" cy="0" r="4.5" fill="#10b981" />
    <text x="6" y="5" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-weight="700" 
          font-size="12" 
          fill="#f8fafc" 
          text-anchor="middle" 
          letter-spacing="0.06em">SACHIN KUMAR • AI &amp; DATA</text>
  </g>
</svg>
